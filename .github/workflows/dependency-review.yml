name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check dependency changes
        uses: actions/dependency-review-action@781e085422ef0d1a6c8bb0ebb85e9e5c0e7656ca # v4
        with:
          fail-on-severity: high
